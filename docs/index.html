<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amora — Legal</title>
<meta name="description" content="Amora's Privacy Policy and Terms of Service.">
<style>
  :root { color-scheme: light; --ink: #1a1a1a; --ink-soft: #4a4a4a; --bg: #fdfcfb; --border: #e6e1db; --accent: #b8395f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.65; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 60px 20px 80px; }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 40px; text-decoration: none; color: var(--ink); }
  .brand-mark { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #ff6a88, #ff8c42); flex: none; }
  .brand-name { font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p.lede { color: var(--ink-soft); margin: 0 0 32px; }
  .links { display: flex; flex-direction: column; gap: 12px; }
  a.card { display: block; padding: 18px 20px; border: 1px solid var(--border); border-radius: 12px; text-decoration: none; color: var(--ink); background: #fff; transition: border-color 0.15s; }
  a.card:hover { border-color: var(--accent); }
  a.card .title { font-weight: 600; font-size: 15.5px; }
  a.card .sub { color: var(--ink-soft); font-size: 13.5px; margin-top: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="index.html">
    <span class="brand-mark"></span>
    <span class="brand-name">Amora</span>
  </a>
  <h1>Legal</h1>
  <p class="lede">The documents governing your use of the Amora app.</p>
  <div class="links">
    <a class="card" href="privacy-policy.html">
      <div class="title">Privacy Policy</div>
      <div class="sub">What we collect, why, and your choices.</div>
    </a>
    <a class="card" href="terms-of-service.html">
      <div class="title">Terms of Service</div>
      <div class="sub">The terms governing your use of the app.</div>
    </a>
  </div>
</div>
</body>
</html>
